<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#00BCD4" />
    <meta name="description" content="Track your daily water intake easily with Droplet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Droplet" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="mask-icon" href="/icon.svg" color="#00BCD4" />
    <link rel="manifest" href="/manifest.json" />
    <title>Droplet - Water Tracker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker directly from HTML for maximum reliability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/simple-service-worker.js')
            .then(function (registration) {
              console.log(
                'HTML: Service Worker registered with scope:',
                registration.scope
              );
            })
            .catch(function (error) {
              console.log('HTML: Service Worker registration failed:', error);
            });
        });
      }
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
  </body>
</html>
